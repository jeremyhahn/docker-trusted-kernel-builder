# ci-template: v1 (adapted — container-builder repo, no Go code)
#
# Reconciled against software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). This repo builds a container
# image and a kernel; it contains no Go source, so the Go half of the §8 suite
# (gosec, govulncheck, go mod verify, golangci-lint, staticcheck) has no
# analogue and is replaced by hadolint + shellcheck. Both trivy gates (fs and
# image) apply unchanged. Structure — guarded GitHub-only steps, trivy CLI on
# Gitea, explicit fail-closed gate — follows the template.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # Gitea has no API to re-run a finished run, so a run that failed for the
  # runner's own reasons can only be repeated by inventing a commit unless the
  # workflow can be dispatched by hand (ci-template v1.3).
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/trusted-kernel-builder

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # make lint is the contract (devops.md §4). It pipes each file to the
    # linter on stdin rather than bind-mounting the workspace: bind mount
    # sources are resolved by the docker daemon, which cannot see the job
    # container's filesystem.
    - name: Lint Dockerfile and shell scripts
      run: make lint

  trivy:
    name: Trivy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Two paths for one gate (devops.md §8). trivy-action's setup step cannot
    # authenticate to github.com from a Gitea runner and upload-sarif has no
    # GHES-compatible endpoint there, so the action-based path is guarded on
    # the server URL and Gitea gates with the trivy CLI below. Both run the
    # same fs scan with the same severity threshold; only the SARIF upload to
    # code scanning is GitHub-only.
    - name: Trivy scan (SARIF for code scanning)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        format: sarif
        output: trivy-results.sarif
        exit-code: 0

    - name: Upload Trivy SARIF
      if: github.server_url == 'https://github.com'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif
        category: trivy-fs

    - name: Trivy gate (fail on CRITICAL/HIGH)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        exit-code: 1
        format: table

    - name: Install Trivy CLI (Gitea)
      if: github.server_url != 'https://github.com'
      run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

    # Source-tree scans do NOT use --ignore-unfixed (devops.md §8).
    - name: Trivy gate (Gitea)
      if: github.server_url != 'https://github.com'
      run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 .

  trivy-image:
    name: Trivy Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # devops.md §8 requires every image the repo builds to be scanned.
    - name: Build image
      run: docker build -t trusted-kernel-builder:ci .

    - name: Install Trivy CLI (Gitea)
      if: github.server_url != 'https://github.com'
      run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

    # --ignore-unfixed is ratified for image scans (devops.md §8): the base
    # image carries unfixable distro advisories at any given moment, so a raw
    # gate would be permanently red. This gate means "a rebuild fixes this".
    - name: Trivy image gate (Gitea)
      if: github.server_url != 'https://github.com'
      run: trivy image --scanners vuln,secret --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 trusted-kernel-builder:ci

    - name: Trivy image gate (fail on CRITICAL/HIGH)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: image
        image-ref: trusted-kernel-builder:ci
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: 1
        format: table

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # No `cache-from/cache-to: type=gha`. The GitHub Actions cache service is
    # unreachable from a Gitea job container, and buildx treats a cache
    # timeout as a FATAL build error rather than a cache miss — this is what
    # failed run 20 (infra/gitea/docs/lessons.md). Plain `docker build` uses
    # the daemon's own layer cache, which works on both hosts.
    - name: Build Docker image
      run: docker build -t trusted-kernel-builder:test .

    - name: Verify Docker image
      run: |
        docker images trusted-kernel-builder:test
        docker run --rm --entrypoint /bin/sh trusted-kernel-builder:test \
          -c "test -x /build/build-fips-kernel.sh"
        echo "Docker image built successfully"

  build-kernel:
    name: Build FIPS Kernel
    runs-on: ubuntu-latest
    needs: [build, trivy, trivy-image]
    # A full kernel compile is expensive; only run it on default-branch pushes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # These paths exist only on GitHub-hosted runners; on a Gitea runner the
    # step would fail (no sudo, nothing to remove).
    - name: Free up disk space
      if: github.server_url == 'https://github.com'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        df -h

    # make build / make test are the contract (devops.md §4). The Makefile
    # extracts artifacts with `docker cp` rather than a bind mount, which is
    # what makes this work in a job container.
    - name: Build FIPS kernel
      run: make build

    - name: Test kernel artifacts
      run: make test

    # upload-artifact v4+ refuses to run against any server that is not
    # github.com — it detects one and reports "not currently supported on
    # GHES", and Gitea presents as such (devops.md §1). The build and its
    # verification have already happened by this point; only the upload is
    # skipped.
    - name: Upload kernel artifacts
      if: github.server_url == 'https://github.com'
      uses: actions/upload-artifact@v6
      with:
        name: kernel-artifacts
        path: |
          output/vmlinuz-fips
          output/vmlinuz-fips.sha256
          output/modules-fips-*.tar.gz
          output/modules-fips-*.tar.gz.sha256
          output/System.map-fips
          output/config-fips
          output/kernel-version.txt
        retention-days: 7

  docker-push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, trivy-image]
    # ghcr.io does not exist on Gitea (lessons.md); publishing to Gitea's own
    # registry is a separate change, so this job is GitHub-only for now.
    # trivy-image gates it: §8 requires the scan BEFORE any registry push.
    if: github.server_url == 'https://github.com' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      packages: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  # The single required check (devops.md §1). Every job above appears in BOTH
  # the needs list and the results check -- a gate that can pass vacuously is
  # worse than no gate. join(needs.*.result) is deliberately not used: it
  # evaluates empty on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, trivy, trivy-image, build, build-kernel, docker-push]

    steps:
    - name: Fail closed on any non-success
      run: |
        # check      — must have run and succeeded.
        # check_cond — deliberately conditional (kernel build is
        #              default-branch only, the ghcr push is GitHub-only), so
        #              "skipped" is a legitimate outcome. Any other non-success
        #              still fails the gate; "skipped" is never accepted for a
        #              job that was supposed to run.
        check()      { case "$2" in success) echo "OK   $1";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
        check_cond() { case "$2" in success|skipped) echo "OK   $1 ($2)";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
        BAD=0
        check      lint         "${{ needs.lint.result }}"
        check      trivy        "${{ needs.trivy.result }}"
        check      trivy-image  "${{ needs.trivy-image.result }}"
        check      build        "${{ needs.build.result }}"
        check_cond build-kernel "${{ needs.build-kernel.result }}"
        check_cond docker-push  "${{ needs.docker-push.result }}"
        exit $BAD
